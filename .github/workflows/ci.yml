name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned to the module's own version rather than `stable`. When
      # `stable` moved to Go 1.27, golangci-lint v2.12.2 (built with 1.26)
      # panicked type-checking the newer standard library, and this check
      # failed on every push for reasons unrelated to the code under test.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test merge gate
        run: make test-gate

      # The scheduled-failure notification path is shell that runs on GitHub
      # runners, so its logic is exercised here against a stubbed gh rather
      # than trusted to a weekly run to discover it is broken.
      - name: test scheduled-failure notification
        run: make test-notify

      # The reproducibility script itself is only ever run against live
      # sources, so its version-aware comparison and exit codes are pinned
      # here against a stubbed assay binary before the weekly run uses them.
      - name: test reproducibility script
        run: make test-reproducibility

      # Tests must pass without network access: every check is a pure function
      # over fixtures captured under internal/*/testdata.
      #
      # The same run records coverage, so the numbers cost no second test pass.
      # The default bash shell runs with pipefail, so tee does not hide a
      # failing test.
      - name: test
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./... 2>&1 | tee go-test.log

      # Per-package coverage, in the log and in the job summary. It reports and
      # does not gate: there is no threshold (#130). It also sends nothing to a
      # third-party service. The report is computed here from `go test` output,
      # and the profile is kept as a GitHub artifact. Runs after a test failure
      # too, since partial numbers are still information — but not when the
      # test step never ran (an earlier vet or build failure), where there is
      # no log to report on and a usage error would only bury the real one.
      - name: coverage report
        if: ${{ !cancelled() && hashFiles('go-test.log') != '' }}
        run: |
          report=$(./scripts/coverage-report.sh go-test.log coverage.out)
          printf '%s\n' "$report"
          {
            echo "### Go coverage"
            echo
            printf '%s\n' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14
          if-no-files-found: warn

  # evidence_hash is the project's reproducibility claim: anyone re-scanning an
  # attested asset must derive byte-identical preimage bytes, whatever Go they
  # run. CI's main job tests one pinned version (go.mod); contributors run
  # others. Map iteration order, strconv formatting and string sorting are
  # where a toolchain difference would surface, so the attest package — the
  # golden byte comparison and its vectors — runs on the pin and on one newer
  # release. A toolchain that changes the bytes fails here instead of shipping
  # as an unexplained hash mismatch. Both legs stay at or above the pin's
  # floor (go.mod), which dropped the end-of-life 1.22 line; setup-go exports
  # GOTOOLCHAIN=local, so a leg below the floor could not build the module.
  #
  # Deliberately narrow, so it does not meaningfully slow CI: this package
  # only, no race detector, no coverage, no matrix for the rest of the module.
  # Explicit versions rather than `stable`: setup-go resolves `stable` to a
  # moving target, which is the same trap the main job's go-version-file pin
  # avoids for golangci-lint.
  attest-reproducibility:
    name: attest on Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # Pure functions over committed fixtures under internal/attest/testdata:
      # no network access needed.
      - name: go test ./internal/attest/
        run: go test ./internal/attest/

      # Mutation testing is deliberately NOT in CI. The decision is recorded in
      # CONTRIBUTING.md ("Mutation testing: decision recorded", issue #110):
      # the manual catalogue in docs/mutation-catalogue.md is the standing
      # practice, run when safety-critical branches change. CI integration was
      # evaluated and declined: mutation runners recompile per mutant, and even
      # a 14-mutation run would add minutes of noisy, advisory-only cost to
      # every PR. This comment exists so the absence is a recorded decision
      # rather than an oversight.

  # The encoding has been reimplemented by hand from the specification twice,
  # and both times the mistake was invisible until someone compared hashes.
  # This job runs a second implementation (scripts/preimage_encoder.py, written
  # from docs/contract-interface.md alone) over every committed vector, every
  # internal/mechanics/testdata subject, and the language-neutral conformance
  # cases. A change that moves the Go bytes without moving the Python bytes --
  # or the other way around -- fails here instead of shipping as a hash
  # mismatch. No network access and no third-party services; python3 is part of
  # the runner image and is checked explicitly so a missing interpreter cannot
  # turn the job into a silent pass.
  preimage-cross-check:
    name: Independent preimage encoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: require python3
        run: python3 --version

      - name: compare independent encoder with Go
        run: make test-preimage

  # The scanner is the instrument every attestation comes from. CI already
  # pins the toolchain it is built with, but nothing checked that two builds of
  # the same commit produce the same bytes -- which is what lets anyone rebuild
  # a released assay and compare the hash. This job builds `make build-release`
  # twice from the same commit in two different directories and fails if the
  # bytes differ. `-trimpath` removes absolute paths, `-buildvcs=false` removes
  # the working tree's VCS state, `CGO_ENABLED=0` removes the host C toolchain,
  # and the toolchain comes from go.mod via setup-go, so the only remaining
  # input is the source. See CONTRIBUTING.md ("Reproducible scanner builds").
  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build twice in different directories
        run: |
          set -eu
          for dir in build-a build-b; do
            rm -rf "$dir"
            mkdir -p "$dir"
            # git archive rather than cp: the build must not depend on .git
            # (buildvcs=false), and this proves the source alone is enough.
            git archive HEAD | tar -x -C "$dir"
            make -C "$dir" build-release
          done

          sha256sum build-a/assay build-b/assay

          if ! cmp -s build-a/assay build-b/assay; then
            echo "::error title=Reproducible build::Two builds of the same commit differ; make build-release is not reproducible."
            exit 1
          fi
          echo "::notice title=Reproducible build::Both builds of $(git rev-parse HEAD) hash identically."

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Pinned to the module's own version rather than `stable`. When
      # `stable` moved to Go 1.27, golangci-lint v2.12.2 (built with 1.26)
      # panicked type-checking the newer standard library, and this check
      # failed on every push for reasons unrelated to the code under test.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: lint shell scripts
        run: find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0 | xargs -0 shellcheck -S warning

  contract:
    name: Soroban contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assay-contracts
    steps:
      - uses: actions/checkout@v7.0.1

      # The toolchain is pinned in assay-contracts/rust-toolchain.toml, which is
      # this job's default working directory. `rustup toolchain install` reads
      # that file and installs the exact channel plus the rustfmt/clippy
      # components and the wasm32v1-none target it declares. Installing
      # components ad hoc here would let CI and the pin drift apart, and a new
      # Rust release adding a lint should not be able to turn main red.
      - name: rust toolchain (pinned)
        run: rustup toolchain install

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Cargo.lock is committed but is only enforced if cargo is told to
      # respect it. Without --locked, cargo silently re-resolves to whatever
      # versions the index currently serves, so CI would stop testing the
      # dependency set the repository claims -- and for a project whose stated
      # invariant is no new dependency without a decision, that is the wrong
      # thing to be testing. A stale or missing lockfile entry now fails the
      # build instead of resolving quietly. cargo fmt is left alone: it does
      # not resolve dependencies and does not accept --locked.
      #
      # These flags live only in CI, not in the Makefile, so a contributor who
      # changes a manifest and has not refreshed the lockfile yet can still
      # build and test locally.
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: check contract test snapshots
        run: |
          if ! git diff --exit-code -- contracts/example-gate/test_snapshots contracts/safety-registry/test_snapshots; then
            echo "::error::Contract tests modified committed snapshots. Review the changed files and commit intentional snapshot updates."
            exit 1
          fi

  # Merge gate: catches PRs that touch maintainer-owned safety-critical paths
  # without manual review. A PR touching only docs or tests merges cleanly;
  # one touching the severity model, the evidence_hash encoding, or the
  # contract's fail-closed logic must be reviewed.
  #
  # The logic lives in scripts/merge-gate.sh so it can be verified offline
  # against real commit ranges before it is trusted against a real PR. Note
  # BASE uses the merge base rather than the PR's base sha directly: force-push
  # history on the base branch can otherwise make every path look changed.
  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: verify CODEOWNERS paths
        run: ./scripts/check-codeowners.sh

      - name: check maintainer-owned paths
        run: |
          BASE=$(git merge-base origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }})

          set +e
          out=$(./scripts/merge-gate.sh "$BASE" ${{ github.event.pull_request.head.sha }} 2>&1)
          rc=$?
          set -e

          printf '%s\n' "$out"
          {
            echo "### Merge gate"
            echo
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A hold is advisory. The gate says a maintainer should look at this
          # PR; it does not say the PR is wrong, and most of the contributor
          # backlog legitimately touches these paths -- an issue asking someone
          # to change the severity model cannot be completed without editing
          # the severity model. Failing CI for that told contributors their
          # correct work was broken. Exit 2 is a real failure: the gate could
          # not run, so its finding is unknown rather than clean.
          case "$rc" in
            0) echo "::notice title=Merge gate::No maintainer-owned paths or dependency files touched." ;;
            1) echo "::notice title=Merge gate::Touches maintainer-owned paths -- a maintainer should review before merge. Advisory: this does not fail CI." ;;
            *) echo "::error title=Merge gate::The gate could not run (exit $rc), so its finding is unknown."; exit 1 ;;
          esac
