[package]
name = "assay-example-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = "28.0.0"
# The integrator surface: the registry interface, the Safety type and the bit
# constants, so this example no longer keeps its own copy that can drift from
# the deployed registry (#469).
assay-gate = { path = "../../crates/assay-gate" }

# Only the tests depend on the registry crate. The gate itself talks to the
# deployed registry through a declared interface, exactly as a third-party
# integrator would, with no build-time dependency on Assay.
[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
assay-safety-registry = { path = "../safety-registry" }
