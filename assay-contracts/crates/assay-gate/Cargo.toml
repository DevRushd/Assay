[package]
name = "assay-gate"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
soroban-sdk = "28.0.0"

# Only the tests need testutils; the library itself stays a plain no_std
# dependency an integrator's contract can pull in.
[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
