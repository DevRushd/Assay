version: "2"

linters:
  enable:
    - bodyclose
    # Error identity is load-bearing: exit codes, undetermined classification
    # and fail-closed paths compare with errors.Is. errorlint catches `==` on
    # wrapped errors; wrapcheck keeps errors wrapped as they cross package
    # boundaries, so errors.Is can see through the context added along the way.
    - errorlint
    - misspell
    - revive
    - unconvert
    - wrapcheck
  settings:
    revive:
      rules:
        - name: exported
          # Assay's reasoning lives in comments; exported identifiers that
          # carry judgment rules must explain themselves.
          disabled: false
  exclusions:
    rules:
      # Fixtures are captured verbatim from live sources and are not edited.
      - path: testdata/
        linters:
          - misspell

formatters:
  enable:
    - gofmt
